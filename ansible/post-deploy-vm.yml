---
# ============================================================
# Post-Deployment Configuration Playbook for QEMU VMs
# Runs against a freshly created VM provisioned via cloud-init.
#
# Key differences from post-deploy.yml (LXC containers):
#   - Uses vm_hostname / password variables
#   - Waits for cloud-init to finish before modifying the system
#   - Installs and enables qemu-guest-agent
#   - Extended wait_for_connection timeout (cloud-init first-boot delay)
#   - Ansible connects via SSH key (no sshpass needed)
#
# ============================================================
# Usage (called automatically by deploy_vm.py):
#   ansible-playbook -i <IP>, post-deploy-vm.yml \
#     -e vm_hostname=myhost \
#     -e password=secret \
#     --private-key ~/.ssh/id_rsa
# ============================================================
- name: Post-deploy VM configuration
  hosts: all
  gather_facts: false
  become: true

  vars:
    vm_hostname: "{{ vm_hostname }}"
    password: "{{ password }}"

  tasks:
    # --------------------------------------------------------
    # Wait for SSH and cloud-init to finish
    # --------------------------------------------------------
    - name: Wait for SSH connection to be available
      wait_for_connection:
        delay: 5
        timeout: 1800

    - name: Gather facts now that SSH is up
      setup:

    - name: Load OS-specific variables
      include_vars: "vars/{{ ansible_os_family }}.yml"

    # sudo_group is loaded from vars/{{ ansible_os_family }}.yml above.
    # (Historical: this set_fact existed before the per-family vars files
    # carried `sudo_group`. Kept here as a comment because removing the
    # task is a behavior change — every existing OS family now supplies
    # the variable; the fallback is the Debian/RedHat-era default.)
    - name: Ensure sudo_group is defined (fallback if vars file is missing it)
      set_fact:
        sudo_group: "{{ sudo_group | default('sudo' if ansible_os_family == 'Debian' else 'wheel') }}"

    - name: Wait for cloud-init first-boot to complete
      wait_for:
        path: /run/cloud-init/result.json
        timeout: 1800
      retries: 5
      delay: 10
      # FreeBSD ships nuageinit instead of real cloud-init; nuageinit doesn't
      # create /run/cloud-init/result.json, so this task would wait the full
      # 1800s × 5 = 2.5 hours before failing. By the time Ansible reaches us
      # on FreeBSD, network + SSH + Python are already set up by the
      # serial-console firstboot module — there's nothing left to wait on.
      when: ansible_os_family != 'FreeBSD'

    # --------------------------------------------------------
    # Hostname
    # --------------------------------------------------------
    - name: Set system hostname
      hostname:
        name: "{{ vm_hostname }}"

    - name: Ensure /etc/hosts has 127.0.1.1 entry
      lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1'
        line: "127.0.1.1 {{ vm_hostname }}"
        state: present

    # --------------------------------------------------------
    # User: {{ addusername }} (same password as root)
    # --------------------------------------------------------
    # Some templates don't ship with the `wheel` group pre-created. The
    # `user:` module's `groups:` parameter requires secondary groups to
    # already exist — Ansible doesn't auto-create them. Create it explicitly
    # first so user creation succeeds on every distro.
    - name: Ensure sudo group '{{ sudo_group }}' exists
      group:
        name: "{{ sudo_group }}"
        state: present

    - name: Create '{{ addusername }}' user
      user:
        name: "{{ addusername }}"
        shell: "{{ user_shell | default('/bin/bash') }}"
        groups: "{{ sudo_group }}"
        append: true
        create_home: true
        state: present

    - name: Set '{{ addusername }}' user password (Linux — chpasswd)
      shell: "echo '{{ addusername }}:{{ password }}' | chpasswd"
      no_log: true
      when: ansible_os_family != 'FreeBSD'

    - name: Set '{{ addusername }}' user password (FreeBSD — pw)
      shell: "echo '{{ password }}' | pw usermod {{ addusername }} -h 0"
      no_log: true
      when: ansible_os_family == 'FreeBSD'

    - name: Set root password (Linux — chpasswd)
      shell: "echo 'root:{{ password }}' | chpasswd"
      no_log: true
      when: ansible_os_family != 'FreeBSD'

    - name: Set root password (FreeBSD — pw)
      shell: "echo '{{ password }}' | pw usermod root -h 0"
      no_log: true
      when: ansible_os_family == 'FreeBSD'

    # --------------------------------------------------------
    # SSH Configuration
    # --------------------------------------------------------
    - name: Ensure sshd_config.d drop-in directory exists
      file:
        path: "{{ sshd_config_d_path | default('/etc/ssh/sshd_config.d') }}"
        state: directory
        mode: '0755'

    - name: Write Poiesis sshd drop-in (root login + password auth)
      copy:
        dest: "{{ sshd_config_d_path | default('/etc/ssh/sshd_config.d') }}/00-poiesis.conf"
        content: |
          # Managed by Poiesis post-deploy.
          # Low-numbered drop-in so these settings take precedence over
          # any later cloud-image-shipped drop-ins (e.g. Ubuntu cloud's
          # 60-cloudimg-settings.conf which sets PasswordAuthentication no).
          PermitRootLogin yes
          PasswordAuthentication yes
        mode: '0644'

    - name: Restart SSH service to apply changes
      service:
        name: "{{ ssh_service }}"
        state: restarted
        enabled: true

    # --------------------------------------------------------
    # Timezone
    # --------------------------------------------------------
    - name: Set timezone
      timezone:
        name: "{{ timezone }}"

    # --------------------------------------------------------
    # Install packages
    # --------------------------------------------------------
    - name: Run OS-specific pre-install tasks
      include_tasks: "tasks/pre-install-{{ ansible_os_family }}.yml"

    - name: Install all standard tools and utilities
      package:
        name: "{{ packages }}"
        state: present

    - name: Install profile packages (if a package profile was selected)
      package:
        name: "{{ profile_packages }}"
        state: present
      when: profile_packages | default([]) | length > 0

    - name: Install extra packages (if specified)
      package:
        name: "{{ extra_packages }}"
        state: present
      when: extra_packages | default([]) | length > 0

    - name: Install qemu-guest-agent
      package:
        name: qemu-guest-agent
        state: present
      when: ansible_os_family != 'FreeBSD'

    # --------------------------------------------------------
    # QEMU Guest Agent
    # --------------------------------------------------------
    # FreeBSD: qemu-guest-agent is in the standard pkg list but enabling it
    # via systemd-style `service` fights FreeBSD's rc.conf convention.
    # Set `qemu_guest_agent_enable="YES"` in /etc/rc.conf and reboot after
    # the deploy completes if you need it on FreeBSD VMs.
    - name: Enable and start qemu-guest-agent
      service:
        name: qemu-guest-agent
        enabled: true
        state: started
      when: ansible_os_family != 'FreeBSD'

    # --------------------------------------------------------
    # NTP Configuration (chrony)
    # --------------------------------------------------------
    - name: Configure chrony NTP
      template:
        src: templates/chrony.conf.j2
        dest: "{{ chrony_conf_path }}"
        backup: true

    - name: Enable and restart chrony
      service:
        name: "{{ chrony_service }}"
        enabled: true
        state: restarted

    # --------------------------------------------------------
    # SNMP Configuration
    # --------------------------------------------------------
    - name: Ensure snmpd.conf parent directory exists
      file:
        path: "{{ snmpd_conf_path | dirname }}"
        state: directory

    - name: Deploy snmpd.conf from template
      template:
        src: templates/snmpd.conf.j2
        dest: "{{ snmpd_conf_path }}"
        backup: true
      vars:
        hostname: "{{ vm_hostname }}"
        deploy_date: "{{ ansible_date_time.iso8601 }}"

    - name: Ensure MIBS directory exists
      file:
        path: "{{ snmp_mibs_dir }}"
        state: directory

    - name: Enable and restart snmpd
      service:
        name: snmpd
        enabled: true
        state: restarted

    # --------------------------------------------------------
    # Final: Full system upgrade
    # --------------------------------------------------------
    - name: Run OS-specific upgrade tasks
      include_tasks: "tasks/upgrade-{{ ansible_os_family }}.yml"

    # --------------------------------------------------------
    # Status report
    # --------------------------------------------------------
    - name: Get system IP addresses
      shell: "{{ ip_show_cmd | default(\"ip -4 addr show scope global | awk '/inet / {print $2}'\") }}"
      register: ip_addrs
      changed_when: false

    - name: Show completion summary
      debug:
        msg:
          - "=========================================="
          - "Post-deployment VM configuration complete!"
          - "Hostname : {{ vm_hostname }}"
          - "IP(s)    : {{ ip_addrs.stdout_lines | join(', ') }}"
          - "Timezone : {{ ansible_date_time.tz }}"
          - "NTP      : chrony configured"
          - "SNMP     : community='{{ snmp_community }}' (rw) on :161"
          - "Users    : root, {{ addusername }} (same password)"
          - "SSH      : PermitRootLogin yes"
          - "QEMU GA  : enabled"
          - "=========================================="
