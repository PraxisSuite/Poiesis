---
# ============================================================
# Alpine Linux OS-specific variables
# Loaded automatically by post-deploy*.yml via:
#   include_vars: "vars/{{ ansible_os_family }}.yml"
# Note: Alpine cloud-init images ship with cloud-init and qemu-guest-agent.
#       Packages live in main + community repos (both enabled by default
#       on cloud images).
# ============================================================

ssh_service: sshd
sudo_group: wheel
chrony_conf_path: /etc/chrony/chrony.conf
chrony_service: chronyd
snmpd_conf_path: /etc/snmp/snmpd.conf
snmp_mibs_dir: /var/lib/snmp/mibs
# Bash isn't in Alpine's `apk` base — it comes from the package list below.
# We still set the additional user's shell to /bin/bash so post-deploy
# experience matches the other distros once bash is installed.
user_shell: /bin/bash
sshd_config_d_path: /etc/ssh/sshd_config.d
ip_show_cmd: "ip -4 addr show scope global | awk '/inet / {print $2}'"

packages:
  # --- Shell baseline ---
  - bash               # required so /bin/bash user shell works

  # --- Network tools ---
  - net-tools          # ifconfig (limited on busybox; full pkg installs GNU coreutils flavor)
  - iproute2           # full ip command (Alpine has busybox `ip` by default, but iproute2 adds tc etc.)
  - nmap               # port scanner
  - iputils            # ping, arping, traceroute
  - mtr                # combined ping+traceroute
  - bind-tools         # dig, nslookup, host  (Alpine name; not bind-utils)
  - netcat-openbsd     # nc - network utility
  - socat              # advanced netcat
  - tcpdump            # packet capture
  - iperf3             # network bandwidth testing
  - fping              # fast parallel ping
  - arp-scan           # ARP scanner
  - ethtool            # ethernet settings
  - iftop              # live bandwidth monitor
  - nload              # network load monitor
  - curl               # HTTP client
  - wget               # HTTP/FTP download

  # --- Text editors ---
  - nano
  - vim

  # --- Data/JSON/YAML tools ---
  - jq                 # JSON processor
  - yamllint           # YAML linter (community repo)
  # python3-jsonschema and shellcheck are in Alpine but under different names;
  # add as `py3-jsonschema` and `shellcheck` if needed — left out to keep
  # the standard set minimal and matching upstream Alpine pkg names.

  # --- Archive/compression tools ---
  - zip
  - unzip
  - tar
  - gzip
  - bzip2
  - xz
  - p7zip              # 7z

  # --- SSH tools ---
  - sshpass            # non-interactive SSH password auth
  - openssh-client

  # --- NTP client ---
  - chrony

  # --- NFS client ---
  - nfs-utils

  # --- SNMP ---
  - net-snmp           # snmpd daemon + snmpwalk/snmpget tools (single pkg on Alpine)

  # --- Hardware inventory tools ---
  - lshw
  - pciutils           # lspci
  - usbutils           # lsusb
  - dmidecode          # DMI/SMBIOS hardware info
  - hdparm
  - smartmontools      # S.M.A.R.T. disk monitoring

  # --- System monitoring & process tools ---
  - htop
  - iotop
  - lsof
  - strace
  - sysstat            # sar, iostat, mpstat

  # --- Development / misc ---
  - git
  - rsync
  - screen
  - tmux
  - tree
  - less
  - psmisc             # killall, fuser, pstree
  - procps             # ps, top, vmstat, free, etc. (Alpine name; not procps-ng)
  - util-linux

  # --- Python ---
  - python3
  - py3-pip            # Alpine name; not python3-pip
  - py3-virtualenv     # Alpine name; not python3-virtualenv

  # --- Misc useful ---
  - bc
  - at
  - cronie             # cron daemon
  - logrotate
